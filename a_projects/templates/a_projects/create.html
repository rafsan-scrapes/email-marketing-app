{% extends 'layouts/page.html' %}

{% block content %}

<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-6">Create Project</h1>

    <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
                <input
                    type="text"
                    name="name"
                    required
                    maxlength="255"
                    class="w-full rounded-lg py-3 px-4 bg-gray-50 border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                    placeholder="e.g., Q3 Cold Outreach"
                >
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Project Type</label>
                <select
                    name="type"
                    required
                    class="w-full rounded-lg py-3 px-4 bg-gray-50 border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                >
                    <option value="">Select type...</option>
                    <option value="email">Email</option>
                    <option value="linkedin_dm">LinkedIn DM</option>
                </select>
            </div>

            <div class="flex gap-3">
                <button type="submit" class="button">Create Project</button>
                <a href="{% url 'a_projects:list' %}" class="button button-gray">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
