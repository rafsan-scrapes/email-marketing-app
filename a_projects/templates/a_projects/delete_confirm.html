{% extends 'layouts/page.html' %}

{% block content %}

<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-6">Delete Project</h1>

    <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
        <p class="text-gray-600 mb-6">
            Are you sure you want to delete <strong>"{{ project.name }}"</strong>?
            This action cannot be undone.
        </p>

        <form method="post" class="flex gap-3 justify-end">
            {% csrf_token %}
            <a href="{% url 'a_projects:list' %}" class="button button-gray">Cancel</a>
            <button type="submit" class="button button-red">Delete</button>
        </form>
    </div>
</div>

{% endblock %}
