<form
    hx-post="{% url 'a_projects:create_htmx' %}"
    hx-target="#projects-list"
    hx-swap="outerHTML"
    hx-on::after-request="if(event.detail.successful) this.reset()"
    class="bg-white p-6 rounded-lg shadow border border-gray-200 mb-6"
    id="create-project-form"
>
    <h2 class="text-xl font-semibold mb-4">Create New Project</h2>

        {% if errors %}
        <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
            <h3 class="text-sm font-semibold text-red-800 mb-2">Please fix the following errors:</h3>
            <ul class="list-disc list-inside text-red-600 text-sm">
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
        <input
            type="text"
            name="name"
            required
            maxlength="255"
            class="w-full rounded-lg py-3 px-4 bg-gray-50 border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            placeholder="e.g., Q3 Cold Outreach"
        >
    </div>

    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Project Type</label>
        <select
            name="type"
            required
            class="w-full rounded-lg py-3 px-4 bg-gray-50 border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
        >
            <option value="">Select type...</option>
            <option value="email">Email</option>
            <option value="linkedin_dm">LinkedIn DM</option>
        </select>
    </div>

    <div class="flex gap-3">
        <button
            type="submit"
            class="button"
        >
            Create Project
        </button>
        <button
            type="button"
            hx-get="{% url 'a_projects:create_htmx' %}"
            hx-target="#create-form-container"
            hx-swap="innerHTML"
            class="button button-gray"
        >
            Cancel
        </button>
    </div>
</form>
