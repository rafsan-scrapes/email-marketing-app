{% if projects %}
    <div class="space-y-4">
        {% for project in projects %}
            {% include 'a_projects/partials/project_row.html' with project=project %}
        {% endfor %}
    </div>
{% else %}
    <div class="text-center py-12">
        <p class="text-gray-500 mb-4">No projects yet.</p>
        <button
            hx-get="{% url 'a_projects:create_htmx' %}"
            hx-target="#create-form-container"
            hx-swap="innerHTML"
            class="button"
        >
            Create Your First Project
        </button>
    </div>
{% endif %}
