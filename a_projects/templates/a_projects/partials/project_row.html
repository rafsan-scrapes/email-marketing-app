<div
    id="project-{{ project.pk }}"
    class="flex items-center justify-between p-4 bg-white rounded-lg shadow border border-gray-200"
>
    <div class="flex items-center gap-4">
        <div class="p-3 rounded-lg {% if project.type == 'email' %}bg-blue-100{% else %}bg-purple-100{% endif %}">
            <span class="text-sm font-medium {% if project.type == 'email' %}text-blue-700{% else %}text-purple-700{% endif %}">
                {{ project.get_type_display }}
            </span>
        </div>
        <div>
            <h3 class="font-semibold text-gray-900">{{ project.name }}</h3>
            <p class="text-sm text-gray-500">Created {{ project.created_at|date:"M d, Y" }}</p>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <a
            href="{% url 'a_projects:detail' project.pk %}"
            class="text-sm text-indigo-600 hover:text-indigo-700"
        >
            Open
        </a>
        <button
            hx-get="{% url 'a_projects:delete_confirm_htmx' project.pk %}"
            hx-target="#delete-modal-container"
            hx-swap="innerHTML"
            class="text-sm text-red-600 hover:text-red-700"
        >
            Delete
        </button>
    </div>
</div>
