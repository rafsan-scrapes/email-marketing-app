{% extends 'layouts/page.html' %}

{% block content %}

        hx-target="#create-form-container"

</div>

<div id="create-form-container"></div>

<div id="projects-list" class="mt-6">
    {% include 'a_projects/partials/project_list.html' with projects=projects %}

{% endblock %}
