{% extends 'layouts/page.html' %}

{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <a href="{% url 'a_projects:detail' project.pk %}" class="text-sm text-gray-500 hover:text-gray-700 mb-2 inline-block">
                ← Back to {{ project.name }}
            </a>
            <h1>Upload CSV</h1>
        </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    CSV File
                </label>
                <input
                    type="file"
                    name="csv_file"
                    accept=".csv"
                    required
                    class="w-full rounded-lg py-3 px-4 bg-gray-50 border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                    hx-post="{% url 'a_contacts:headers_htmx' project.pk %}"
                    hx-target="#key-column-container"
                    hx-swap="innerHTML"
                    hx-include="[name='csv_file']"
                >
                <p class="mt-1 text-sm text-gray-500">Select a CSV file with headers in the first row.</p>
            </div>

            <div id="key-column-container">
                {% include 'a_contacts/partials/key_column_dropdown.html' with headers=headers suggested_key=suggested_key %}
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="button">
                    Import Contacts
                </button>
                <a href="{% url 'a_projects:detail' project.pk %}" class="button button-gray">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
